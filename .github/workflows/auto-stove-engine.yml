name: Autonomous Wood & Pellet Stove BTU & Chimney Sizing Engine

on:
  schedule:
    - cron: '15 */6 * * *'
  workflow_dispatch:
    inputs:
      custom_stove:
        description: 'Optional Stove Model or Cabin Size (e.g. Drolet Escape 1800 Wood Stove)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  generate-stove-calculators:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Stove Calculators & Ping Search Engines
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          PAGES_PER_RUN: '3'
          CUSTOM_STOVE: ${{ github.event.inputs.custom_stove || '' }}
        run: |
          python engine/stove_builder.py

      - name: Commit & Push to Trigger GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ data/published_stoves.json
          if git diff --staged --quiet; then
            echo "No new stove calculator pages to commit."
          else
            git commit -m "chore(hearth): auto-publish new wood & pellet stove calculators"
            git push origin main
          fi
